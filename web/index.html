<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>代码审查 Agent</title>
<style>
  :root {
    --bg: #0d0f15;
    --bg-glow: radial-gradient(1200px 500px at 50% -180px, rgba(99,102,241,.16), transparent 60%);
    --card: #141824;
    --card-2: #1a1f2e;
    --border: #262c3d;
    --border-soft: #1f2533;
    --text: #e7eaf2;
    --muted: #8b93a8;
    --faint: #5c657a;
    --accent: #6366f1;
    --accent-2: #a855f7;
    --green: #34d399;
    --red: #f87171;
    --code-bg: #0c0f16;
    --shadow: 0 8px 30px rgba(0,0,0,.35);
    --mono: "SF Mono", "JetBrains Mono", ui-monospace, Consolas, "Cascadia Code", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", "Noto Sans SC", sans-serif;
    background: var(--bg) var(--bg-glow);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.7;
    min-height: 100vh;
  }
  .app { max-width: 920px; margin: 0 auto; padding: 44px 22px 88px; }

  /* ---------- 头部 ---------- */
  .hero { display: flex; align-items: center; gap: 16px; margin-bottom: 30px; }
  .logo {
    width: 52px; height: 52px; flex: none;
    display: grid; place-items: center; font-size: 26px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-radius: 15px; box-shadow: 0 6px 20px rgba(99,102,241,.35);
  }
  .hero-text { flex: 1; }
  .hero h1 {
    margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em;
    background: linear-gradient(120deg, #a5b4fc, #e9d5ff 60%, #93c5fd);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .badge {
    padding: 5px 12px; font-size: 12px; font-weight: 600;
    color: #a5b4fc; background: rgba(99,102,241,.12);
    border: 1px solid rgba(99,102,241,.3); border-radius: 999px;
    white-space: nowrap;
  }

  /* ---------- 输入卡片 ---------- */
  .search-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 18px; box-shadow: var(--shadow);
  }
  .input-wrap { display: flex; gap: 10px; }
  .input-wrap input {
    flex: 1; padding: 14px 16px; font-size: 15px; color: var(--text);
    background: var(--card-2); border: 1px solid var(--border);
    border-radius: 11px; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .input-wrap input::placeholder { color: var(--faint); }
  .input-wrap input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(99,102,241,.18);
  }
  .input-wrap button {
    padding: 14px 28px; font-size: 15px; font-weight: 700; color: #fff;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none; border-radius: 11px; cursor: pointer; white-space: nowrap;
    box-shadow: 0 6px 18px rgba(99,102,241,.3);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  .input-wrap button:hover { transform: translateY(-1px); filter: brightness(1.08); }
  .input-wrap button:active { transform: translateY(0); }
  .input-wrap button:disabled { filter: grayscale(.5) brightness(.7); cursor: not-allowed; transform: none; }
  .hints { display: flex; align-items: center; gap: 8px; margin-top: 13px; flex-wrap: wrap; }
  .hints .lbl { color: var(--faint); font-size: 12.5px; }
  .hint {
    padding: 4px 11px; font-size: 12.5px; font-family: var(--mono);
    color: var(--muted); background: var(--card-2);
    border: 1px solid var(--border-soft); border-radius: 999px;
    cursor: pointer; transition: color .12s, border-color .12s;
  }
  .hint:hover { color: #a5b4fc; border-color: var(--accent); }

  /* ---------- 状态与错误 ---------- */
  .status {
    display: flex; align-items: center; gap: 9px; margin-top: 18px;
    padding: 13px 16px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; color: var(--muted); font-size: 14px;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .status .dot:nth-child(2) { animation-delay: .15s; }
  .status .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%,80%,100% { transform: translateY(0); opacity:.4; } 40% { transform: translateY(-5px); opacity:1; } }

  .error {
    margin-top: 18px; padding: 14px 16px; background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.35); border-radius: 12px;
    color: #fca5a5; font-size: 14px; white-space: pre-wrap;
  }

  /* ---------- 空状态 ---------- */
  .empty {
    margin-top: 34px; text-align: center; padding: 52px 20px;
    color: var(--muted);
  }
  .empty .face { font-size: 44px; display: block; margin-bottom: 14px; }
  .empty h3 { color: var(--text); font-size: 17px; margin: 0 0 8px; }
  .empty p { font-size: 14px; margin: 0; }

  /* ---------- 区块标题 ---------- */
  section { margin-top: 30px; animation: rise .35s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  section h2 {
    display: flex; align-items: center; gap: 8px;
    font-size: 15px; margin: 0 0 14px; color: var(--text); font-weight: 700;
  }
  section h2::after { content: ""; flex: 1; height: 1px; background: var(--border-soft); }

  /* ---------- 工具调用时间线 ---------- */
  .timeline { margin: 0; padding: 0; list-style: none; position: relative; }
  .timeline::before {
    content: ""; position: absolute; left: 15px; top: 6px; bottom: 6px;
    width: 2px; background: var(--border-soft);
  }
  .timeline li {
    position: relative; padding: 0 0 14px 42px;
  }
  .timeline .dot-step {
    position: absolute; left: 8px; top: 6px; width: 16px; height: 16px;
    border-radius: 50%; background: var(--card); border: 2px solid var(--accent);
    display: grid; place-items: center;
  }
  .step-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 16px;
  }
  .step-head { font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .step-head .step-num { color: var(--faint); font-size: 12px; font-family: var(--mono); }
  .step-head b { color: #a5b4fc; font-family: var(--mono); font-weight: 600; }
  .step-head .step-status { color: var(--accent); font-size: 12.5px; margin-left: auto; }
  .step-args { color: var(--muted); font-family: var(--mono); font-size: 13px; margin-top: 5px; word-break: break-all; }
  .step-card details { margin-top: 9px; }
  .step-card summary { cursor: pointer; color: var(--faint); font-size: 12.5px; user-select: none; }
  .step-card pre {
    margin: 8px 0 0; padding: 11px 13px; background: var(--code-bg);
    border-radius: 9px; font-size: 12.5px; overflow-x: auto; max-height: 230px;
    font-family: var(--mono);
  }

  /* ---------- 审查报告 ---------- */
  .report {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 26px 30px; font-size: 15px;
    box-shadow: var(--shadow);
  }
  .report h2 { font-size: 19px; border: none; margin: 24px 0 10px; }
  .report h2::after { display: none; }
  .report h2:first-child { margin-top: 0; }
  .report h3 { font-size: 16px; margin: 20px 0 8px; }
  .report p { margin: 9px 0; }
  .report ul, .report ol { margin: 9px 0; padding-left: 26px; }
  .report li { margin: 5px 0; }
  .report li::marker { color: var(--accent); }
  .report code {
    background: var(--code-bg); padding: 2px 7px; border-radius: 6px;
    font-family: var(--mono); font-size: 13px; color: #fbbf24;
    border: 1px solid var(--border-soft);
  }
  .report pre code { background: none; border: none; color: inherit; padding: 0; }
  .codeblock {
    margin: 14px 0; border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; background: var(--code-bg);
  }
  .code-lang {
    padding: 7px 14px; font-size: 11px; font-family: var(--mono);
    color: var(--faint); background: var(--card-2);
    border-bottom: 1px solid var(--border-soft); text-transform: lowercase;
  }
  .codeblock pre {
    margin: 0; padding: 14px 16px; overflow-x: auto;
    font-family: var(--mono); font-size: 13px; line-height: 1.6;
  }
  .tok-com { color: #6b7280; font-style: italic; }
  .tok-str { color: #7ee787; }
  .tok-kw  { color: #ff7b72; }
  .tok-num { color: #79c0ff; }

  .hidden { display: none; }

  @media (max-width: 640px) {
    .input-wrap { flex-direction: column; }
    .hero { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hero">
    <div class="logo">🔍</div>
    <div class="hero-text">
      <h1>代码审查 Agent</h1>
      <p>基于 DeepSeek · 原生 Agent 循环（模型 → 工具调用 → 结果）</p>
    </div>
    <span class="badge">DeepSeek</span>
  </header>

  <div class="search-card">
    <div class="input-wrap">
      <input id="path" type="text" placeholder="输入文件或目录路径，例如 examples/sample_code.py"
             autocomplete="off" spellcheck="false">
      <button id="go">开始审查</button>
    </div>
    <div class="hints">
      <span class="lbl">试试：</span>
      <span class="hint" data-path="examples/sample_code.py">examples/sample_code.py</span>
      <span class="hint" data-path="examples">examples/</span>
      <span class="hint" data-path="agent.py">agent.py</span>
    </div>
  </div>

  <div id="status" class="status hidden">
    <span class="dot"></span><span class="dot"></span><span class="dot"></span>
    <span id="status-text">正在分析…</span>
  </div>

  <div id="error" class="error hidden"></div>

  <div id="empty" class="empty">
    <span class="face">🤖</span>
    <h3>输入一个路径，开始代码审查</h3>
    <p>Agent 会先浏览目录、读取代码，再输出分级审查报告（🔴 严重 / 🟡 中等 / 🟢 轻微）</p>
  </div>

  <section id="steps-section" class="hidden">
    <h2>🛠 工具调用过程</h2>
    <ol id="steps" class="timeline"></ol>
  </section>

  <section id="report-section" class="hidden">
    <h2>📄 审查报告</h2>
    <div id="report" class="report"></div>
  </section>
</div>

<script>
(function () {
  var pathInput = document.getElementById('path');
  var goBtn = document.getElementById('go');
  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var errorEl = document.getElementById('error');
  var emptyEl = document.getElementById('empty');
  var stepsSection = document.getElementById('steps-section');
  var stepsEl = document.getElementById('steps');
  var reportSection = document.getElementById('report-section');
  var reportEl = document.getElementById('report');

  var reportRaw = '';   // 累积的原始 Markdown 报告文本
  var finished = false; // 本次流式是否已结束
  var stepEls = {};     // tool_call id -> li 元素

  function show(el) { el.classList.remove('hidden'); }
  function hide(el) { el.classList.add('hidden'); }
  function setError(msg) {
    if (msg) { errorEl.textContent = msg; show(errorEl); }
    else { hide(errorEl); }
  }
  function setStatus(msg) {
    if (msg) { statusText.textContent = msg; show(statusEl); }
    else { hide(statusEl); }
  }

  // ---------- 文本渲染 ----------
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  // 轻量代码高亮：注释 / 字符串 / 关键字 / 数字，其余原样转义
  function highlightCode(code) {
    var re = /(#.*)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|\b(def|return|if|elif|else|for|while|import|from|class|try|except|finally|with|as|in|not|and|or|None|True|False|lambda|yield|raise|pass|break|continue|global|assert|self|print|len|range|int|str|list|dict|set)\b|(\b\d+(?:\.\d+)?\b)/g;
    var parts = [];
    var last = 0, m;
    while ((m = re.exec(code)) !== null) {
      if (m.index > last) parts.push(escapeHtml(code.slice(last, m.index)));
      if (m[1]) parts.push('<span class="tok-com">' + escapeHtml(m[1]) + '</span>');
      else if (m[2]) parts.push('<span class="tok-str">' + escapeHtml(m[2]) + '</span>');
      else if (m[3]) parts.push('<span class="tok-kw">' + escapeHtml(m[3]) + '</span>');
      else if (m[4]) parts.push('<span class="tok-num">' + escapeHtml(m[4]) + '</span>');
      last = re.lastIndex;
    }
    parts.push(escapeHtml(code.slice(last)));
    return parts.join('');
  }
  function renderInline(s) {
    s = escapeHtml(s);
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
    return s;
  }
  function codeBlock(buf, lang) {
    return '<div class="codeblock">' +
           '<div class="code-lang">' + escapeHtml(lang || 'code') + '</div>' +
           '<pre><code>' + highlightCode(buf.join('\n')) + '</code></pre></div>';
  }
  // 极简 Markdown 渲染：只处理本 Agent 输出会用到的子集
  function renderMarkdown(text) {
    var lines = text.split('\n');
    var html = '';
    var inCode = false, codeBuf = [], codeLang = '';
    var listType = null, listBuf = [];
    function flushList() {
      if (listBuf.length) {
        html += (listType === 'ol' ? '<ol>' : '<ul>') + listBuf.join('') +
                (listType === 'ol' ? '</ol>' : '</ul>');
        listBuf = []; listType = null;
      }
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^\s*```/.test(line)) {
        flushList();
        if (inCode) {
          html += codeBlock(codeBuf, codeLang);
          codeBuf = []; inCode = false; codeLang = '';
        } else {
          var lm = line.match(/^```(\w*)/);
          codeLang = lm ? lm[1] : '';
          inCode = true;
        }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }

      var h = line.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        flushList();
        var lvl = Math.min(h[1].length + 1, 5);
        html += '<h' + lvl + '>' + renderInline(h[2]) + '</h' + lvl + '>';
        continue;
      }
      var ul = line.match(/^\s*[-*]\s+(.*)$/);
      if (ul) {
        if (listType !== 'ul') { flushList(); listType = 'ul'; }
        listBuf.push('<li>' + renderInline(ul[1]) + '</li>');
        continue;
      }
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ol) {
        if (listType !== 'ol') { flushList(); listType = 'ol'; }
        listBuf.push('<li>' + renderInline(ol[1]) + '</li>');
        continue;
      }
      if (line.trim() === '') { flushList(); continue; }
      flushList();
      html += '<p>' + renderInline(line) + '</p>';
    }
    flushList();
    if (inCode) html += codeBlock(codeBuf, codeLang);
    return html;
  }

  function formatArgs(args) {
    return Object.keys(args || {})
      .map(function (k) { return k + '=' + JSON.stringify(args[k]); })
      .join(', ');
  }

  // ---------- 流式事件处理 ----------
  function addStep(evt) {
    var li = document.createElement('li');
    li.innerHTML =
      '<div class="dot-step"></div>' +
      '<div class="step-card">' +
        '<div class="step-head">' +
          '<span class="step-num">STEP ' + evt.step + '</span>' +
          '<b>' + escapeHtml(evt.name) + '</b>' +
          '<span class="step-status">执行中…</span>' +
        '</div>' +
        '<div class="step-args">' + escapeHtml(formatArgs(evt.arguments)) + '</div>' +
      '</div>';
    stepsEl.appendChild(li);
    stepEls[evt.id] = li;
    show(stepsSection);
  }
  function updateStep(evt) {
    var li = stepEls[evt.id];
    if (!li) return;
    li.innerHTML =
      '<div class="dot-step" style="border-color:var(--green)"></div>' +
      '<div class="step-card">' +
        '<div class="step-head">' +
          '<span class="step-num">STEP ' + evt.step + '</span>' +
          '<b>' + escapeHtml(evt.name) + '</b>' +
          '<span class="step-status" style="color:var(--green)">完成 ✓</span>' +
        '</div>' +
        '<div class="step-args">' + escapeHtml(formatArgs(evt.arguments)) + '</div>' +
        '<details><summary>查看工具返回</summary><pre>' +
        escapeHtml(evt.result || '') + '</pre></details>' +
      '</div>';
  }
  function appendToken(text) {
    reportRaw += text;
    reportEl.innerHTML = renderMarkdown(reportRaw);
    show(reportSection);
  }

  function handleEvent(evt, es) {
    switch (evt.type) {
      case 'status': setStatus(evt.message); break;
      case 'tool_call':
        addStep(evt);
        setStatus('正在执行工具 ' + evt.name + ' …');
        break;
      case 'tool_result': updateStep(evt); break;
      case 'token':
        appendToken(evt.content);
        setStatus('正在生成审查报告…');
        break;
      case 'clear':
        reportRaw = '';
        reportEl.innerHTML = '';
        break;
      case 'error':
        finished = true; es.close();
        setStatus(null); goBtn.disabled = false;
        setError(evt.message);
        break;
      case 'done':
        finished = true; es.close();
        setStatus(null); goBtn.disabled = false;
        if (!reportRaw) reportEl.innerHTML = '<p>（无输出）</p>';
        show(reportSection);
        break;
    }
  }

  function run(path) {
    path = (path || pathInput.value).trim();
    if (!path) { setError('请输入要审查的文件或目录路径'); return; }
    setError('');
    hide(emptyEl); hide(stepsSection); hide(reportSection);
    stepsEl.innerHTML = '';
    reportEl.innerHTML = '';
    reportRaw = '';
    finished = false;
    stepEls = {};
    pathInput.value = path;
    goBtn.disabled = true;

    var es = new EventSource('/api/review/stream?path=' + encodeURIComponent(path));
    es.onmessage = function (e) {
      var evt;
      try { evt = JSON.parse(e.data); } catch (err) { return; }
      handleEvent(evt, es);
    };
    es.onerror = function () {
      if (finished) return;
      finished = true;
      es.close();
      setStatus(null); goBtn.disabled = false;
      setError('连接中断：请确认服务已启动（项目目录运行 python app.py），且是通过 http://127.0.0.1:8000 访问，而非双击打开 index.html');
    };
  }

  goBtn.addEventListener('click', function () { run(); });
  pathInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') run();
  });
  // 快捷示例：点击直接填入并审查
  Array.prototype.forEach.call(document.querySelectorAll('.hint'), function (el) {
    el.addEventListener('click', function () { run(el.getAttribute('data-path')); });
  });
})();
</script>
</body>
</html>
